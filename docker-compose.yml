services:
  api:
    build: .
    ports: ["8080:8080"]
    environment:
      CLASSIFIER_URL: http://classifier:8000
      DATABASE_URL: jdbc:postgresql://postgres:5432/serviceops
      DATABASE_USER: serviceops
      DATABASE_PASSWORD: serviceops
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      classifier:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
  classifier:
    build: ./ml-service
    ports: ["8000:8000"]
  postgres:
    # pgvector's own image; the plain postgres image has no vector extension, so
    # V1__init.sql's CREATE EXTENSION would fail there.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: serviceops
      POSTGRES_USER: serviceops
      POSTGRES_PASSWORD: serviceops
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceops -d serviceops"]
      interval: 5s
      timeout: 5s
      retries: 10
  kafka:
    # Single-node KRaft: no ZooKeeper, and a fixed cluster id so the volume survives restarts.
    image: apache/kafka:3.9.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: serviceops-local-cluster
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # INTERNAL is how the api container connects; EXTERNAL is for producing from the host.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on: [api]
  grafana:
    image: grafana/grafana:11.5.1
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local-only convenience so the dashboard opens without a login prompt.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
volumes:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
