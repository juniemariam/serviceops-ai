spring:
  application:
    name: serviceops-ai
  http:
    client:
      # Pinned to Apache HttpClient 5 rather than left to classpath detection. The JDK
      # HttpClient factory frames these POSTs as Transfer-Encoding: chunked in a way
      # uvicorn's HTTP parser rejects, so the classifier sees an empty body and returns
      # 422. Detection would silently fall back to it if httpclient5 were ever dropped.
      factory: http-components
      # Without these, a hung classifier blocks a diagnosis thread indefinitely.
      connect-timeout: ${CLASSIFIER_CONNECT_TIMEOUT:2s}
      read-timeout: ${CLASSIFIER_READ_TIMEOUT:5s}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/serviceops}
    username: ${DATABASE_USER:serviceops}
    password: ${DATABASE_PASSWORD:serviceops}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Ingestion is idempotent (alert fingerprint, deployment event id), so at-least-once
      # redelivery is safe and earliest avoids silently dropping a backlog on a new group.
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
    producer:
      # Used only by the dead letter publisher.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      # Every series carries these, so dashboards can separate environments and replicas.
      application: ${spring.application.name}
      environment: ${SERVICEOPS_ENVIRONMENT:dev}
  tracing:
    sampling:
      # Full sampling is fine at this volume; lower it before any real traffic.
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
serviceops:
  classifier-url: ${CLASSIFIER_URL:http://localhost:8000}
  retrieval:
    top-k: ${RETRIEVAL_TOP_K:3}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    group-id: ${KAFKA_GROUP_ID:serviceops-ingest}
    partitions: ${KAFKA_PARTITIONS:3}
    retries: ${KAFKA_RETRIES:2}
    retry-interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
  diagnosis:
    # How far back to look for a release that could explain an incident.
    deployment-correlation-window: ${DEPLOYMENT_CORRELATION_WINDOW:PT2H}
