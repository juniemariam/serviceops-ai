global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: serviceops-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: serviceops-api
  - job_name: classifier
    metrics_path: /metrics
    static_configs:
      - targets: ["classifier:8000"]
        labels:
          service: serviceops-classifier
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
